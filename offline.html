
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23321F">
  <title>SIMPUSKESWAN - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f7f2;
      color: #23321F;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 32px 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 24px rgba(0,0,0,.08);
    }
    h2 { margin-top: 0; }
    p { line-height: 1.6; color: #586454; }
    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 9px;
      background: #426b3b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h2>SIMPUSKESWAN</h2>
    <p>Perangkat sedang tidak terhubung ke internet.</p>
    <p>Silakan periksa koneksi internet Anda, kemudian coba kembali.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
